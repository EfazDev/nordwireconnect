name: Build NordWireConnect
on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:
jobs:
    build:
        name: Build (Windows amd64)
        runs-on: windows-latest
        env:
            SKIP_SIGN: "1"
            UPX_VERSION: "5.0.2"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Python (x64)
              uses: actions/setup-python@v5
              with:
                python-version: "3.15"
                architecture: x64
                cache: pip
            - name: Install dependencies
              shell: pwsh
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt
            - name: Download UPX (win64)
              shell: pwsh
              run: |
                Invoke-WebRequest "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip" -OutFile upx.zip
                Expand-Archive upx.zip -DestinationPath upx_tmp
                New-Item -ItemType Directory -Force UPX | Out-Null
                Copy-Item "upx_tmp\upx-$env:UPX_VERSION-win64\upx.exe" "UPX\upx.exe"
            - name: Build stable (Rebuild.bat)
              shell: cmd
              run: call Rebuild.bat
            - name: Build debug (Debug.bat)
              shell: cmd
              run: call Debug.bat
            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                name: NordWireConnect
                path: |
                  dist/NordWireConnectInstaller.exe
                  dist/NordWireConnectDebugInstaller.exe
                if-no-files-found: error
            - name: Upload crash report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                name: nuitka-crash-report
                path: nuitka-crash-report.xml
                if-no-files-found: ignore