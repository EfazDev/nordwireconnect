name: Build NordWireConnect
on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:
jobs:
    build:
        name: Build (Windows amd64)
        runs-on: windows-latest
        env:
            SKIP_SIGN: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Python (x64)
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"
                architecture: x64
                cache: pip
                cache-dependency-path: requirements.txt
            - name: Install dependencies
              shell: pwsh
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt
            - name: Cache Nuitka (clcache + downloads)
              uses: actions/cache@v4
              with:
                path: ~\AppData\Local\Nuitka
                key: nuitka-${{ runner.os }}-py314-${{ hashFiles('*.py') }}
                restore-keys: |
                  nuitka-${{ runner.os }}-py314-
            - name: Build stable (Rebuild.bat)
              shell: cmd
              run: call Rebuild.bat
            - name: Upload installer
              uses: actions/upload-artifact@v7
              with:
                path: dist/NordWireConnectInstaller.exe
                archive: false
                if-no-files-found: error
            - name: Upload crash report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                name: nuitka-crash-report
                path: nuitka-crash-report.xml
                if-no-files-found: ignore